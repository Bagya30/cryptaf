name: Android Appium E2E Automation Pipeline & GitHub Pages Reporting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e-suite:
    name: Build, Run Android Emulator, Execute Appium Tests & Publish Reports
    runs-on: macos-13

    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: Stage 2 - Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Stage 3: Setup Android SDK
      - name: Stage 3 - Set up Android SDK
        uses: android-actions/setup-android@v3

      # Stage 4: Install Android Dependencies & Flutter SDK
      - name: Stage 4 - Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.1'
          channel: 'stable'
          cache: true

      - name: Stage 4 - Create .env from Secrets
        run: |
          cat > .env << EOF
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_SERVICE_ID_CRYPTAF=${{ secrets.EMAILJS_SERVICE_ID_CRYPTAF }}
          EMAILJS_TEMPLATE_ID_DEFAULT=${{ secrets.EMAILJS_TEMPLATE_ID_DEFAULT }}
          EMAILJS_TEMPLATE_ID_ALERT=${{ secrets.EMAILJS_TEMPLATE_ID_ALERT }}
          EMAILJS_TEMPLATE_ID_DOCUMENT_EXPIRY=${{ secrets.EMAILJS_TEMPLATE_ID_DOCUMENT_EXPIRY }}
          EMAILJS_USER_ID=${{ secrets.EMAILJS_USER_ID }}
          EMAILJS_USER_ID_DOCUMENT_EXPIRY=${{ secrets.EMAILJS_USER_ID_DOCUMENT_EXPIRY }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          MASTER_APP_KEY=${{ secrets.MASTER_APP_KEY }}
          EOF

      - name: Stage 4 - Install Flutter Pub Dependencies
        run: flutter pub get

      # Stage 5: Build Debug APK
      - name: Stage 5 - Build Android Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: Stage 6-7 - Start Android Emulator & Verify Readiness
        uses: reactivecircuits/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            adb wait-for-device
            adb shell input keyevent 82

      # Stage 8: Install APK onto Emulator
      - name: Stage 8 - Install APK onto Android Emulator
        run: adb install -r build/app/outputs/flutter-apk/app-debug.apk

      # Stage 9 & 10: Start Appium Server & Verify Health
      - name: Stage 9-10 - Install & Start Appium Server (UiAutomator2)
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 10
          curl -s http://127.0.0.1:4723/wd/hub/status || echo "Appium status check complete"

      # Stage 11: Set up Python Environment & Run Appium Tests
      - name: Stage 11 - Set up Python Automation Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Automation Dependencies
        run: pip install openpyxl Appium-Python-Client pytest requests

      # Stage 12-17: Run Appium E2E Tests & Generate Reports
      - name: Stage 12-17 - Execute 440 Appium Test Cases & Generate Reports
        run: python build_appium_framework.py

      # Stage 18: Upload Artifacts
      - name: Stage 18 - Upload Appium Automation Artifacts (30 Days Retention)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-appium-e2e-reports
          retention-days: 30
          path: |
            Test Results/Excel/
            Test Results/HTML/
            Test Results/JSON/
            Test Results/Summary/
            Test Results/Screenshots/
            Test Results/Logs/

      # Stage 19 & 20: Publish Reports to GitHub Pages (latest & history)
      - name: Stage 19-20 - Publish Appium Reports to GitHub Pages History
        if: always()
        run: |
          mkdir -p gh-pages/reports/latest
          mkdir -p gh-pages/reports/history/build-${{ github.run_number }}
          cp -r "Test Results/HTML/"* gh-pages/reports/latest/
          cp -r "Test Results/Summary/"* gh-pages/reports/latest/
          cp -r "Test Results/HTML/"* gh-pages/reports/history/build-${{ github.run_number }}/
          cp -r "Test Results/Summary/"* gh-pages/reports/history/build-${{ github.run_number }}/

      - name: Deploy Reports to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true

      # Stage 21: Publish GitHub Action Summary
      - name: Stage 21 - Publish Step Summary
        if: always()
        run: cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
