name: cryptaf
description: "A secure digital vault app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  file_picker: ^6.1.1
  google_generative_ai: ^0.4.6
  google_fonts: ^6.2.1
  http: ^1.6.0
  crypto: ^3.0.7
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  local_auth: ^2.2.0
  shared_preferences: ^2.2.2
  encrypt: ^5.0.3
  otp: ^3.1.2
  qr_flutter: ^4.1.0
  pdf: ^3.11.0
  camera: 0.11.0+2
  firebase_messaging: any
  firebase_crashlytics: any
  google_sign_in: any
  firebase_performance: any
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.0
  printing: ^5.13.2
  path_provider: ^2.1.3
  flutter_quill: 9.3.20
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  camera_android_camerax: 0.6.7+2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
