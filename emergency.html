<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Medical Card | Cryptaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0A0A0A;
      color: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .header {
      width: 100%;
      max-width: 500px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }
    .header h1 {
      font-family: 'Oxanium', sans-serif;
      color: #EF4444;
      font-size: 16px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    .blood-card {
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid #EF4444;
      text-align: center;
      padding: 24px 20px;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
    }
    .blood-label {
      color: #F87171;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .blood-value {
      font-family: 'Oxanium', sans-serif;
      font-size: 42px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 2px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .contact-card {
      border-color: rgba(34, 197, 94, 0.4);
    }
    .contact-card .card-title { color: #4ADE80; }
    .allergies-card {
      border-color: rgba(249, 115, 22, 0.4);
    }
    .allergies-card .card-title { color: #FB923C; }
    .doctor-card {
      border-color: rgba(59, 130, 246, 0.4);
    }
    .doctor-card .card-title { color: #60A5FA; }
    .card-value {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .btn-call {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.15s ease;
    }
    .btn-call:active {
      transform: scale(0.98);
    }
    .btn-call-green {
      background: #22C55E;
      color: #000000;
    }
    .btn-call-blue {
      background: transparent;
      border: 1px solid #3B82F6;
      color: #60A5FA;
    }
    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: #EF4444;
      font-size: 18px;
      font-weight: 600;
    }
    .error-card {
      text-align: center;
      padding: 30px 20px;
      color: #F87171;
    }
    .footer {
      margin-top: 30px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚨 EMERGENCY MEDICAL PROFILE 🚨</h1>
  </div>

  <div class="container" id="content">
    <div class="loading-spinner">Loading Medical Profile...</div>
  </div>

  <div class="footer">
    Powered by Cryptaf Emergency Protocol
  </div>

  <script>
    async function loadEmergencyProfile() {
      const contentEl = document.getElementById('content');
      const urlParams = new URLSearchParams(window.location.search);
      let uid = urlParams.get('uid');

      if (!uid) {
        const pathSegments = window.location.pathname.split('/');
        const lastSeg = pathSegments[pathSegments.length - 1];
        if (lastSeg && lastSeg !== 'emergency.html') {
          uid = lastSeg;
        }
      }

      if (!uid) {
        contentEl.innerHTML = `
          <div class="card error-card">
            <h2 style="margin-bottom:8px;">No Profile Requested</h2>
            <p style="color:rgba(255,255,255,0.7); font-size:14px;">Invalid emergency link parameters.</p>
          </div>
        `;
        return;
      }

      try {
        const response = await fetch(`https://firestore.googleapis.com/v1/projects/cryptaf-36296/databases/(default)/documents/users/${uid}/medicalProfile/profile`);
        if (!response.ok) {
          throw new Error('Profile not found');
        }
        const data = await response.json();
        const fields = data.fields || {};

        const bloodGroup = fields.bloodGroup?.stringValue || 'N/A';
        const allergies = fields.allergies?.stringValue || 'None specified';
        const emergencyName = fields.emergencyName?.stringValue || 'N/A';
        const emergencyPhone = fields.emergencyPhone?.stringValue || '';
        const doctorName = fields.doctorName?.stringValue || 'N/A';
        const doctorPhone = fields.doctorPhone?.stringValue || '';
        const conditions = fields.medicalConditions?.stringValue || 'None specified';

        contentEl.innerHTML = `
          <div class="card blood-card">
            <div class="blood-label">BLOOD GROUP</div>
            <div class="blood-value">${bloodGroup.toUpperCase()}</div>
          </div>

          <div class="card contact-card">
            <div class="card-title">📞 Emergency Contact</div>
            <div class="card-value">${emergencyName}</div>
            ${emergencyPhone ? `<a href="tel:${emergencyPhone}" class="btn-call btn-call-green">Call Contact: ${emergencyPhone}</a>` : ''}
          </div>

          <div class="card allergies-card">
            <div class="card-title">⚠️ Allergies</div>
            <div class="card-value" style="font-size:16px; font-weight:400; line-height:1.4;">${allergies}</div>
          </div>

          <div class="card doctor-card">
            <div class="card-title">👨‍⚕️ Primary Doctor</div>
            <div class="card-value">${doctorName}</div>
            ${doctorPhone ? `<a href="tel:${doctorPhone}" class="btn-call btn-call-blue">Call Doctor: ${doctorPhone}</a>` : ''}
          </div>

          <div class="card">
            <div class="card-title" style="color:rgba(255,255,255,0.7);">📋 Medical Conditions</div>
            <div style="font-size:16px; color:rgba(255,255,255,0.9); line-height:1.4;">${conditions}</div>
          </div>
        `;
      } catch (e) {
        contentEl.innerHTML = `
          <div class="card error-card">
            <h2 style="margin-bottom:8px;">Emergency Card Unavailable</h2>
            <p style="color:rgba(255,255,255,0.7); font-size:14px;">The requested medical profile does not exist or is unavailable.</p>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadEmergencyProfile);
  </script>
</body>
</html>
